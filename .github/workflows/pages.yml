# Publica el sitio en GitHub Pages empujando a la rama gh-pages.
#
# Pages no corre código, y el navegador no puede consultar a INUMET por su
# cuenta porque no manda cabeceras CORS. La salida es hacer el scraping *acá*,
# en CI: `tools/generar.mjs` consulta INUMET y deja los JSON ya normalizados
# junto a la web, así que el sitio se sirve entero desde Pages y no depende de
# ningún servidor propio.
#
# Antes usaba actions/deploy-pages, que después de subir el artefacto se queda
# esperando a que GitHub confirme el deployment. Con un dominio custom sin
# certificado emitido esa confirmación no llega nunca: el job muere a los 10
# minutos con "Timeout reached, aborting!" y el sitio se queda en la versión
# anterior sin que nada avise. Publicar por rama no depende de esa confirmación.
name: Deploy Pages

on:
  # Los datos se refrescan solos. INUMET declara max-age de 60–300 s, pero cada
  # media hora alcanza de sobra para un visor y mantiene el gasto de Actions
  # bajo. OJO: GitHub apaga los cron en repos sin actividad por 60 días.
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths: ['public/**', 'lib/**', 'tools/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sin dependencias: no hay npm install que hacer.
      - name: Generar los JSON desde INUMET
        run: node tools/generar.mjs dist

      - name: Publicar dist/ en gh-pages
        run: |
          set -euo pipefail
          # Los commits de gh-pages van a tu nombre, no al del bot: si no,
          # github-actions[bot] aparece en el historial del repo.
          git config user.name  "AnderKitty"
          git config user.email "AnderKitty@users.noreply.github.com"

          # A /tmp antes de cambiar de rama: el checkout huérfano borra todo lo
          # que haya en el árbol, dist/ incluido.
          rm -rf /tmp/sitio && cp -r dist /tmp/sitio

          # Rama huérfana: gh-pages contiene solo el sitio, sin el historial
          # del backend.
          git checkout -q --orphan gh-pages-tmp
          git rm -rqf --cached .
          find . -maxdepth 1 -not -name '.git' -not -name '.' -exec rm -rf {} +
          cp -r /tmp/sitio/. .

          # Sin esto Pages corre Jekyll, que ignora los archivos que empiezan
          # con guion bajo.
          touch .nojekyll

          git add -A
          git commit -qm "sitio desde ${GITHUB_SHA::7}"
          git push -qf origin gh-pages-tmp:gh-pages
          echo "publicado: $(ls | tr '\n' ' ')"
