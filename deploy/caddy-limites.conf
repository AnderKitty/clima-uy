# Drop-in de Caddy.
#
# 1) Binario actualizado. El paquete de Debian trae 2.6.2 (2022), que no puede
#    emitir certificados: intenta ZeroSSL con credenciales EAB de un servicio
#    dado de baja ("caddy_legacy_user_removed") y además tiene un panic conocido
#    en el worker de certificados. instalar.sh baja el binario oficial actual a
#    /usr/local/bin/caddy y lo usamos desde acá.
#
# 2) Topes de memoria: este VPS corre el scanner OSINT (pico 1 GB de 1.9 GB,
#    sin swap). Caddy no puede ser el que dispare el OOM.
[Service]
ExecStart=
ExecStart=/usr/local/bin/caddy run --environ --config /etc/caddy/Caddyfile
ExecReload=
ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile --force

MemoryHigh=80M
MemoryMax=128M
Nice=10
CPUWeight=20
